<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Service</title>
          <style>
               header{
                    text-align: center;
               }
               section{
                    font-size: large;
                    padding: 20px;
               }
               .service-layout{
                    display: flex;
                    align-items: flex-start;
                    gap: 30px;
               }
               .service-text{
                    flex: 1;
                    max-width: 500px;
               }
               .service-img{
                    width: 280px;
                    flex: 1;
                    height: auto;
                    border-radius: 8px;
               }
               /*make it stack on mobile*/
               @media (max-width:768px){
                    .service-layout{
                         flex-direction: column;
                    }
                    .service-img{
                         width:100%;
                         max-width: 400px;
                         margin: 0 auto;
                    }
               }
               
           </style>
     </head>
     <body>
          <div id="wrapper">
               
                <header>
                     <h1 id="sitetitle">Service:</h1>
                     
                </header>
               <section id="content">
                  <div class="service-layout">
                   <div class="service-text"> 
                    <p>We provide services like maintenance, repair and replacement
                    of laptops and computers accessories.Furthermore the company also 
                    assist with consultation of computer devices e.g gaming, research,
                    assignment and coding.
                    </p>
                   </div>
                   <img src="images/media7-bg.jpg" alt="Tech Service" class="service-img">
                  </div>
               </section>
          
                    
                    
               
          </div>
     </body>
</html>
