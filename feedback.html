<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeback</title>
    <style>
        body{
            font-size: larger;
        }
    </style>
</head>
<body>
    <fieldset id="fldset">
        <label>Customer Feedback</label>
        <p>
        <label for="p">Poor</label>
        <input type="radio" id="p" value="P" name="status"/>
        <label for="g">Good</label>
        <input type="radio" id="g" value="g" name="status"/>
        <label for="v">Very Good</label>
        <input type="radio" id="v" value="v" name="status"/>
        <label for="e">excellent</label>
        <input type="radio" id="e" value="e" name="status"/>
        </p>  
    </fieldset>

    <fieldset id="fldset">
        <label>Quality of products</label>
        <p><label>Is it user friendly?</label></p>
        <p>
        <label for="y">Yes</label>
        <input type="radio" id="y" value="y" name="status"/>
        <label for="n">No</label>
        <input type="radio" id="n" value="n" name="status"/>
        </p>
     </fieldset>

    <fieldset id="fldset">
        <label>Product Affordability</label>
        <p>
        <label for="y">Yes</label>
        <input type="radio" id="y" value="y" name="status"/>
        <label for="n">No</label>
        <input type="radio" id="n" value="n" name="status"/>
        </p>
    </fieldset>

    
</body>
</html>
